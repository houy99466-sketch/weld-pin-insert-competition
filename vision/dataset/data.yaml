# YOLO OBB 数据集配置
# 目录结构要求：
#   dataset/
#     images/train/*.jpg   images/val/*.jpg
#     labels/train/*.txt   labels/val/*.txt
#     data.yaml            ← 本文件
# 标签格式（每行一个工件）：class x1 y1 x2 y2 x3 y3 x4 y4   （0~1 归一化，四点按顺序）

path: .            # 相对于本文件所在目录
train: images/train
val: images/val

names:
  0: A_up        # 工件A 正姿
  1: A_side      # 工件A 侧姿
  2: A_down      # 工件A 倒姿
  3: B_up        # 工件B 正姿
  4: B_side      # 工件B 侧姿
  5: B_down      # 工件B 倒姿
